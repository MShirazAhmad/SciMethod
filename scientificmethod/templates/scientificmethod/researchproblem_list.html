{% extends "scientificmethod/base.html" %}
{% block content %}
<h1 class="mb-4">Research Problems</h1>

<div class="mb-3">
    <a href="{% url 'researchproblem_create' %}" class="btn btn-success">➕ Add New Problem</a>
</div>

<ul class="list-group">
    {% for problem in researchproblems %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'researchproblem_detail' problem.id %}">{{ problem.title }}</a>
        <div>
            <a href="{% url 'researchproblem_update' problem.id %}" class="btn btn-sm btn-primary">✏️ Edit</a>
            <a href="{% url 'researchproblem_delete' problem.id %}" class="btn btn-sm btn-danger">🗑️ Delete</a>
        </div>
    </li>
    {% empty %}
    <li class="list-group-item">No research problems yet. Create one!</li>
    {% endfor %}
</ul>
{% endblock %}
