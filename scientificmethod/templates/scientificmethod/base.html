<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Scientific Method Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstree@3.3.15/dist/jstree.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/jstree@3.3.15/dist/themes/default/style.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'mdeditor/css/editormd.preview.css' %}">
    <link rel="stylesheet" href="{% static 'mdeditor/css/editormd.css' %}">
    <script src="{% static 'mdeditor/js/editormd.min.js' %}"></script>
    <style>
        body {
            padding-top: 1rem;
        }
        #sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        #sidebar a {
            text-decoration: none;
            color: #000;
        }
        #sidebar a:hover {
            background-color: #e2e6ea;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
<nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse show">
    <div class="position-sticky pt-3">
        <h5 class="text-center mb-4">Navigation</h5>
        <ul class="nav flex-column">

            <li class="nav-item">
                <a class="nav-link" href="{% url 'home' %}">🏠 Home</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'researchproblem_list' %}">🧠 Research Problems</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'researchproblem_create' %}">➕ Add Research Problem</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'scientific_tree' %}">🌳 Tree View</a>
            </li>

            <li class="nav-item">
                <hr>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'experiment_create' experimentalplan_id=1 %}">⚗️ ➕ Add Experiment</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'researchproblem_list' %}">📈 Manage Experiments</a>
            </li>

            <li class="nav-item">
                <hr>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'researchproblem_list' %}">📊 Manage Observations</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'researchproblem_list' %}">⚡ Manage Failure Logs</a>
            </li>

        </ul>
    </div>
</nav>


        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>

</body>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const previews = document.querySelectorAll('.editormd-preview');
    previews.forEach(preview => {
      const observer = new MutationObserver(() => {
        if (window.MathJax) {
          MathJax.typesetPromise([preview]);
        }
      });
      observer.observe(preview, { childList: true, subtree: true });
    });
  });
</script>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
    svg: { fontCache: 'global' }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</html>
